# ---------------------------------------------------------------------------
#  Arcanum Mysticum — build properties
#
#  ВАЖНО: перед первой сборкой сверьте четыре версии ниже с актуальными
#  значениями (см. README.md, раздел «Сборка»):
#    * yarn_mappings  -> https://meta.fabricmc.net/v2/versions/yarn/1.21.11
#    * loader_version -> https://meta.fabricmc.net/v2/versions/loader
#    * fabric_version -> https://modrinth.com/mod/fabric-api/versions?g=1.21.11
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.17.2
loom_version=1.11-SNAPSHOT

# Fabric API
fabric_version=0.135.0+1.21.11

# Mod
mod_version=1.0.0
maven_group=net.arcanum
archives_base_name=arcanum
