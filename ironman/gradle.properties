# ---------------------------------------------------------------------------
#  Iron Man (Stark Industries) — build properties
#
#  Версии сверены с ветками 1.21.11 репозиториев FabricMC (yarn, fabric-api).
#  Если сборка не находит какую-то из них, актуальные значения здесь:
#    * yarn_mappings  -> https://meta.fabricmc.net/v2/versions/yarn/1.21.11
#    * loader_version -> https://meta.fabricmc.net/v2/versions/loader
#    * fabric_version -> https://modrinth.com/mod/fabric-api/versions?g=1.21.11
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.17.3
loom_version=1.13.3

# Fabric API
fabric_version=0.141.6+1.21.11

# Mod
mod_version=1.0.0
maven_group=net.ironman
archives_base_name=ironman
